# Atualiza o catálogo local de modelos do Compras Paraguai (LesteShop, Fase 1).
# Roda toda segunda-feira às 06:00 UTC (03:00 de Brasília) e pode ser disparado
# manualmente na aba Actions ("Run workflow").
name: Atualizar catálogo de modelos

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-catalogo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    # 10 s entre requisições: um sitemap grande pode levar bastante tempo.
    timeout-minutes: 340
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: pip install -e .

      - name: Rodar os testes
        run: pip install pytest && python -m pytest -q

      - name: Atualizar o catálogo a partir do sitemap
        id: catalogo
        env:
          LESTESHOP_CONTATO: "github.com/${{ github.repository }}"
        run: |
          # Em caso de falha (site fora do ar, robots.txt, sitemap mudou) o comando
          # sai com código 1, imprime ::error:: e NÃO altera data/catalogo_modelos.csv.
          python -m lesteshop.data.catalogo atualizar

      - name: Commit (somente se o catálogo mudou)
        run: |
          if git diff --quiet -- data/catalogo_modelos.csv; then
            echo "Catálogo sem mudanças; nada a commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogo_modelos.csv data/catalogo_meta.json
          git commit -m "Catálogo de modelos atualizado em ${{ steps.catalogo.outputs.ultima_atualizacao }}: ${{ steps.catalogo.outputs.novos }} novos, ${{ steps.catalogo.outputs.removidos }} removidos (total ${{ steps.catalogo.outputs.total }})"
          git push
